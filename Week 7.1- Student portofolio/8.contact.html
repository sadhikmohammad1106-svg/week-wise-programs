
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

<body>
    <header class="navbar">
        <a href="1.index.html" class="logo">Sadhik<span>.</span></a>
        <nav>
            <a href="1.index.html">Home</a>
            <a href="3.about.html">About</a>
            <a href="4.education.html">Education</a>
            <a href="5.skills.html">Skills</a>

            <a href="7.certification.html">Certificates</a>
            <a href="8.contact.html" class="active">Contact</a>
        </nav>
    </header>

    <main>
        <section class="page-banner">
            <h1>Contact <span>Me</span></h1>
            <p>Have a question or opportunity? Get in touch.</p>
        </section>

        <section class="content-section">
            <h2>Let's Connect</h2>
            <p>You can visit my GitHub profile to see my coding practice.</p>

            <p style="margin-top:15px">
                <a class="text-link"
                   href="https://github.com/sadhikmohammad1106-svg"
                   target="_blank" rel="noopener noreferrer">
                    Visit My GitHub →
                </a>
            </p>

            <form class="contact-form" action="#" method="get">
                <label>
                    Your Name
                    <input type="text" name="name"
                           placeholder="Enter your name" required>
                </label>

                <label>
                    Your Email
                    <input type="email" name="email"
                           placeholder="Enter your email" required>
                </label>

                <label>
                    Subject
                    <input type="text" name="subject"
                           placeholder="Enter the subject" required>
                </label>

                <label>
                    Your Message
                    <textarea name="message"
                              placeholder="Write your message here"
                              required></textarea>
                </label>

                <button type="submit" class="btn primary-btn">
                    Submit Form
                </button>
            </form>
        </section>
    </main>

    <footer class="footer">
        <p>© 2026 Sadhik | Personal Portfolio</p>
    </footer>
</body>
