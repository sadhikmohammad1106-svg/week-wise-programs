<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript Prompt Example</title>
</head>
<body>
    <h2>JavaScript Prompt Example</h2>
    <script>
        // Display a prompt message and store the user input
        let userName = prompt("Please enter your name:");
        alert("Hello, " + userName + "! Welcome to the website.");
    </script>
</body>
</html>
