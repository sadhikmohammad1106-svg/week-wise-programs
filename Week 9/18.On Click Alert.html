<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>On Click Alert</title>
</head>
<body>
    <h2>On Click Alert Example</h2>
    <button onclick="showAlert()">click me</button>
    <script>
        function showAlert() {
            alert("Button clicked! This is an on-click alert.");
        }
    </script>
</body>
</html>
