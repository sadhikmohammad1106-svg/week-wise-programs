<html>
<body>
<script>
let arr = [6, 2, 99, 7, 9, 3, 15, 4];
let key = 99;
let found = false;
for (let i = 0; i < arr.length; i++) {
    if (arr[i] === key) {
        found = true;
        break;
    }
}
if (found) {
    document.write("Element found");
} else {
    document.write("Element not found");
}
</script>
</body>
</html>
