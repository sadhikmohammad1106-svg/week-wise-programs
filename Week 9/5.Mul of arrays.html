<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mul of arrays</title>
</head>
<body>
    <script>
        let i,numbers = [10, 25, 7, 40, 15]; 
        let mul=1;
        for (i = 0; i < numbers.length; i++) {
            mul *= numbers[i];
        }
        document.write("Multiplication of the array elements: " + mul);
        console.log("Multiplication of the array elements: " + mul);
    </script>
</body>
</html>
