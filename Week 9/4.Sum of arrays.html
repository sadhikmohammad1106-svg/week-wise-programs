<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>sum of arrays</title>
</head>
<body>
    <script>
        let i,numbers = [10, 25, 7, 40, 15]; 
        let sum=0;
        for (i = 0; i < numbers.length; i++) {
            sum += numbers[i];
        }
        document.write("Sum of the array elements: " + sum);
        console.log("Sum of the array elements: " + sum);
    </script>
</body>
</html>
