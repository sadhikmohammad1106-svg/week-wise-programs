<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loops</title>
</head>
<body>
     <h2>Mutiplication Table of 5(for loop)</h2> 
    <div id="t1"></div>

    <h2>Numbers 1 to 100 (while loop)</h2>
    <div id="t2"></div>

    <h2>Countdown 100 to 1 (do while loop)</h2>
    <div id="t3"></div>

    <script>
        let table = "";
        for (let i = 1; i <= 30; i++) {
            table += "5 x " + i + "\t = \t" + (5 * i) + "\n<br>";
        }
        document.getElementById("t1").innerHTML = table;

        let numbers = "";
        let j = 1;
        while (j <= 100) {
            numbers += j + "<br>";
            j++;
        }
        document.getElementById("t2").innerHTML = numbers;

        let countdown = "";
        let k = 100;
        do {
            countdown += k + "<br>";
            k--;
        } while (k >= 1);
        document.getElementById("t3").innerHTML = countdown;
    </script>
</body>
</html>
