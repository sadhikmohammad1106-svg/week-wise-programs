<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Largest number of arrays</title>
</head>
<body>
    <script>
        let i, numbers = [10, 25, 7, 40, 15];
        let largest = numbers[0];
        for (i = 1; i < numbers.length; i++) {
            if (numbers[i] > largest) {
                largest = numbers[i];
            }
        }
        document.write("Largest number in the array: " + largest);
        console.log("Largest number in the array: " + largest);
    </script>
</body>
</html>
